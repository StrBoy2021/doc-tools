<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>图片转 PDF</title>
<style>
 *{box-sizing:border-box}
 body{font:14px/1.6 -apple-system,"Microsoft YaHei",sans-serif;margin:0;background:#f6f7f9;color:#222}
 .wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
 h1{font-size:20px;margin:0 0 4px}
 .sub{color:#666;margin-bottom:18px;font-size:13px}
 a{color:#2f6fed;text-decoration:none}
 .card{background:#fff;border:1px solid #e3e5e8;border-radius:10px;padding:16px;margin-bottom:14px}
 .drop{border:2px dashed #c8ccd2;border-radius:10px;padding:26px;text-align:center;color:#666;cursor:pointer}
 .drop.on{border-color:#2f6fed;background:#f2f6ff;color:#2f6fed}
 .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0}
 label{font-size:13px;color:#444}
 select,input[type=text]{padding:6px 8px;border:1px solid #d0d4da;border-radius:6px;font:inherit}
 button{background:#2f6fed;color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;cursor:pointer}
 button:disabled{background:#9db4e0;cursor:default}
 button.mini{background:#eef1f6;color:#333;padding:2px 8px;border-radius:6px;font-size:12px}
 .hide{display:none}
 .ok{color:#17864b;font-weight:600}
 .err{color:#c62828;font-weight:600}
 a.dl{display:inline-block;margin-right:12px;background:#17864b;color:#fff;padding:8px 14px;
      border-radius:8px;text-decoration:none}
 .hint{color:#888;font-size:12px}
 #list{margin-top:8px}
 .item{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid #eceef2;border-radius:8px;margin-bottom:6px}
 .item img{width:46px;height:46px;object-fit:cover;border-radius:6px;background:#f0f2f5}
 .item .meta{flex:1;min-width:0}
 .item .meta b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .item .meta small{color:#888}
</style></head><body><div class="wrap">
<h1>图片转 PDF</h1>
<div class="sub">全程在本浏览器里完成:图片不上传、服务器不参与、可断网使用。</div>
<div class="sub" style="margin-bottom:12px"><a href="/">OCR + 脱敏</a> · <a href="/img2pdf">图片转 PDF</a> · <a href="/letter">律师函批量生成</a></div>
<div class="card">
  <div class="drop" id="drop">把图片拖到这里,或点一下选择(可多选)
    <div class="hint" id="pick"></div></div>
  <input type="file" id="file" accept="image/*" multiple class="hide">

  <div class="row">
    <button class="mini" id="sortnat">按文件名排序</button>
    <button class="mini" id="reverse">反序</button>
    <button class="mini" id="clearall">清空</button>
    <span class="hint" id="count">还没有图片</span>
  </div>

  <div id="list"></div>

  <div class="row">
    <label>页面</label>
    <select id="mode">
      <option value="auto">原图尺寸(一图一页)</option>
      <option value="a4">A4 居中留白</option>
    </select>
    <label>体积</label>
    <select id="compress">
      <option value="0.85">压缩(JPEG 85, 体积小)</option>
      <option value="0.6">压缩(JPEG 60, 更小)</option>
      <option value="0">原样直嵌(无损, 体积大)</option>
    </select>
  </div>
  <div class="row">
    <label>输出文件名</label>
    <input type="text" id="outname" value="output" size="18">
    <span class="hint">.pdf 会自动加</span>
  </div>

  <div class="row"><button id="go" disabled>生成 PDF</button>
    <span class="hint" id="state"></span></div>
  <div id="result" class="row hide"></div>
</div>
</div>
<script src="static/img2pdf.js"></script>
<script>
const $ = id => document.getElementById(id);

function render() {
  const arr = ImgToPdf.list();
  $('count').textContent = arr.length ? ('共 ' + arr.length + ' 张') : '还没有图片';
  $('go').disabled = arr.length === 0;
  const box = $('list');
  box.innerHTML = '';
  arr.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'item';

    const im = document.createElement('img');
    im.src = it.url;
    im.alt = '';
    row.appendChild(im);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const b = document.createElement('b');
    b.textContent = (i + 1) + '. ' + it.name;
    const sm = document.createElement('small');
    sm.textContent = it.w + ' × ' + it.h;
    meta.appendChild(b); meta.appendChild(sm);
    row.appendChild(meta);

    const ops = document.createElement('div');
    [['↑', 'up'], ['↓', 'down'], ['✕', 'del']].forEach(([txt, op]) => {
      const btn = document.createElement('button');
      btn.className = 'mini';
      btn.textContent = txt;
      btn.onclick = () => {
        if (op === 'del') ImgToPdf.remove(it.id);
        else ImgToPdf.move(it.id, op === 'up' ? -1 : 1);
        render();
      };
      ops.appendChild(btn);
    });
    row.appendChild(ops);
    box.appendChild(row);
  });
}

async function take(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  $('state').textContent = '读取图片…';
  const added = await ImgToPdf.add(list);
  if (!added.length) $('state').innerHTML = '<span class="err">没有可用的图片(浏览器不支持 tiff)</span>';
  else $('state').textContent = '已加入 ' + added.length + ' 张';
  render();
}

$('drop').onclick = () => $('file').click();
$('file').onchange = e => take(e.target.files);
['dragenter', 'dragover'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').className = 'drop on'; }));
['dragleave', 'drop'].forEach(t => $('drop').addEventListener(t, e => {
  e.preventDefault(); $('drop').className = 'drop'; }));
$('drop').addEventListener('drop', e => take(e.dataTransfer.files));

$('sortnat').onclick = () => { ImgToPdf.sortNatural(); render(); };
$('reverse').onclick = () => { ImgToPdf.reverse(); render(); };
$('clearall').onclick = () => { ImgToPdf.clear(); render(); $('result').className = 'row hide'; $('state').textContent = ''; };

$('go').onclick = async () => {
  const go = $('go');
  go.disabled = true;
  $('result').className = 'row hide';
  try {
    $('state').textContent = '生成中…';
    const bytes = await ImgToPdf.make({
      pageMode: $('mode').value,
      compress: parseFloat($('compress').value) || 0,
      onProgress: (d, t) => { $('state').textContent = d + '/' + t + ' 页'; },
    });
    const name = (($('outname').value.trim() || 'output').replace(/\.pdf$/i, '')) + '.pdf';
    const a = document.createElement('a');
    a.className = 'dl';
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    a.download = name;
    a.textContent = '下载 ' + name;
    $('result').innerHTML = '';
    $('result').appendChild(a);
    $('result').className = 'row';
    $('state').textContent = '完成: ' + ImgToPdf.list().length + ' 页, ' + (bytes.length / 1024).toFixed(0) + ' KB';
  } catch (e) {
    $('state').innerHTML = '<span class="err">' + (e && e.message ? e.message : e) + '</span>';
  } finally {
    go.disabled = false;
  }
};
</script></body></html>
